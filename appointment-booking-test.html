<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Booking Test - Consultation Type Logic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Appointment Booking Test - Consultation Type Logic</h4>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="consultationType" class="form-label">Consultation Type</label>
                            <select class="form-select" id="consultationType" required>
                                <option value="" selected disabled>Select consultation type</option>
                                <option value="general consult">General Consult (8AM-11AM, 1PM-4PM, Mon-Fri)</option>
                                <option value="dental">Dental (8AM-11AM, Mon/Wed/Fri)</option>
                                <option value="immunization">Immunization (8AM-12PM, Wed)</option>
                                <option value="prenatal & family planning">Prenatal & Family Planning (8AM-11AM, 1PM-4PM, Mon/Wed/Fri)</option>
                                <option value="dots consult">DOTS Consult (1PM-4PM, Mon-Fri)</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="age" class="form-label">Patient Age</label>
                            <input type="number" class="form-control" id="age" min="0" max="120" value="25">
                        </div>
                        
                        <div class="mb-3">
                            <label for="appointmentId" class="form-label">Appointment ID (for testing)</label>
                            <input type="number" class="form-control" id="appointmentId" value="123">
                        </div>
                        
                        <button type="button" class="btn btn-primary" onclick="testBookingFlow()">Test Booking Flow</button>
                        <button type="button" class="btn btn-secondary" onclick="testCompleteForm()">Test Complete Form Button</button>
                        
                        <div class="mt-4">
                            <h5>Expected Behavior:</h5>
                            <ul>
                                <li><strong>General Consult:</strong> Should redirect to assessment form (NCD for age ≥20, HEEADSSS for age 10-19, message for age <10)</li>
                                <li><strong>Other Types:</strong> Should show success message and redirect to appointments page</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function testBookingFlow() {
            const consultationType = $('#consultationType').val();
            const age = parseInt($('#age').val());
            const appointmentId = $('#appointmentId').val();
            
            if (!consultationType) {
                alert('Please select a consultation type');
                return;
            }
            
            // Simulate the booking success flow
            const isGeneralConsult = consultationType === 'general consult';
            
            Swal.fire({
                title: 'Appointment Saved!',
                text: isGeneralConsult 
                    ? 'Your appointment has been saved successfully! Continue to the assessment form or cancel the appointment.'
                    : 'Your appointment has been saved successfully! No additional assessment form is required.',
                icon: 'success',
                confirmButtonText: isGeneralConsult ? 'Continue to Assessment' : 'View Appointments',
                cancelButtonText: 'Cancel Appointment',
                showCancelButton: true,
                confirmButtonColor: '#28a745',
                cancelButtonColor: '#dc3545',
                allowOutsideClick: false,
                allowEscapeKey: false
            }).then((result) => {
                if (result.isConfirmed) {
                    if (isGeneralConsult) {
                        console.log('General Consult - redirecting to assessment form');
                        if (age >= 20) {
                            alert(`Would redirect to: /User/NCDRiskAssessment?appointmentId=${appointmentId}`);
                        } else if (age >= 10 && age <= 19) {
                            alert(`Would redirect to: /User/HEEADSSSAssessment?appointmentId=${appointmentId}`);
                        } else {
                            alert('Appointment details saved! No assessment form is required for patients under 10 years old.');
                        }
                    } else {
                        console.log('Non-General Consult - skipping assessment form');
                        alert(`Would redirect to: /User/Appointments (${consultationType} appointment completed)`);
                    }
                } else if (result.dismiss === Swal.DismissReason.cancel) {
                    console.log('User chose to cancel appointment');
                    alert('Would redirect to: /User/Appointments');
                }
            });
        }
        
        function testCompleteForm() {
            const consultationType = $('#consultationType').val();
            const age = parseInt($('#age').val());
            const appointmentId = $('#appointmentId').val();
            
            if (!consultationType) {
                alert('Please select a consultation type');
                return;
            }
            
            // Simulate the Complete Form button logic
            const isGeneralConsult = consultationType && consultationType.toLowerCase().includes('general consult');
            
            if (!isGeneralConsult) {
                Swal.fire({
                    title: 'No Assessment Required',
                    text: `${consultationType} appointments do not require additional assessment forms.`,
                    icon: 'info',
                    confirmButtonText: 'OK',
                    confirmButtonColor: '#17a2b8'
                });
                return;
            }
            
            // For General Consult, determine assessment form
            if (age >= 20) {
                alert(`Would redirect to: /User/NCDRiskAssessment?appointmentId=${appointmentId}`);
            } else if (age >= 10) {
                alert(`Would redirect to: /User/HEEADSSSAssessment?appointmentId=${appointmentId}`);
            } else {
                alert('No assessment form is required for patients under 10 years old.');
            }
        }
    </script>
</body>
</html>
